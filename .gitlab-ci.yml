workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: always
    - when: never

stages:
  - sync_to_gerrit
  - sync_to_github

variables:
  GIT_SUBMODULE_STRATEGY: recursive

sync_to_gerrit:
  stage: sync_to_gerrit
  # Disabled: the pipeline now mirrors GitLab -> GitHub only.
  rules:
    - when: never
  image:
    name: $CI_REGISTRY/sifli/forge-mirror:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  cache:
    key: hub-mirror-$CI_RUNNER_EXECUTABLE_ARCH
    paths:
      - hub-mirror-cache
  script:
    - set -eu
    - SRC_KEY="$(printf "%s" "$GITLAB_SSH_PRIVATE_KEY" | base64 -d | tr -d '\r')"
    - DST_KEY="$(printf "%s" "$GERRIT_SSH_PRIVATE_KEY" | base64 -d | tr -d '\r')"
    - |
      if [ -z "$SRC_KEY" ]; then
        echo "GITLAB_SSH_PRIVATE_KEY is required" >&2
        exit 1
      fi
    - |
      if [ -z "$DST_KEY" ]; then
        echo "GERRIT_SSH_PRIVATE_KEY is required" >&2
        exit 1
      fi
    - mkdir -p ~/.ssh
    - printf "%s\n" "$SRC_KEY" > ~/.ssh/id_rsa_src
    - chmod 600 ~/.ssh/id_rsa_src
    - printf "%s\n" "$DST_KEY" > ~/.ssh/id_rsa_dst
    - chmod 600 ~/.ssh/id_rsa_dst
    - printf "StrictHostKeyChecking no\nUserKnownHostsFile /dev/null\n" >> ~/.ssh/config
    - mkdir -p "$CI_PROJECT_DIR/hub-mirror-cache"
    - |
      REPOS_CFG="$(cat <<EOF
      static:
        - $CI_PROJECT_NAME
      refs:
        branches:
          include: [master]
        tags:
          include: ['*']
      EOF
      )"
    - |
      hubmirror \
        --src-platform "gitlab" \
        --src-account "$CI_PROJECT_NAMESPACE" \
        --dst-platform "git" \
        --dst-account "" \
        --src-account-type "group" \
        --src-endpoint "$CI_SERVER_SHELL_SSH_HOST:8218" \
        --dst-endpoint "$GERRIT_ENDPOINT" \
        --src-transport "ssh" \
        --dst-transport "ssh" \
        --dst-ssh-user "$GERRIT_SSH_USER" \
        --src-ssh-user "git" \
        --cache-path "$CI_PROJECT_DIR/hub-mirror-cache" \
        --repos "$REPOS_CFG" \
        --push-strategy "force" \
        --dst-token "dummy" \
        --src-token $CI_JOB_TOKEN

sync_to_github:
  stage: sync_to_github
  image:
    name: $CI_REGISTRY/sifli/forge-mirror:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - set -eu
    - |
      if [ -z "${GITHUB_DEPLOY_KEY:-}" ]; then
        echo "GITHUB_DEPLOY_KEY is required" >&2
        exit 1
      fi
      if [ -z "${GITHUB_REPO:-}" ]; then
        echo "GITHUB_REPO is required" >&2
        exit 1
      fi
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf "%s" "$GITHUB_DEPLOY_KEY" | base64 -d | tr -d '\r' > ~/.ssh/id_rsa_github
    - chmod 600 ~/.ssh/id_rsa_github
    - printf "Host github.com\n  IdentityFile ~/.ssh/id_rsa_github\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n" >> ~/.ssh/config
    - git remote add github "git@github.com:${GITHUB_REPO}.git" || git remote set-url github "git@github.com:${GITHUB_REPO}.git"
    - git fetch github
    - git push github "HEAD:master" --force-with-lease
    - |
      branch_tags="$(git for-each-ref --format='%(refname)' --merged HEAD refs/tags)"
      if [ -n "$branch_tags" ]; then
        echo "Pushing tags to GitHub..."
        git push github $branch_tags
      else
        echo "No tags to push."
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
