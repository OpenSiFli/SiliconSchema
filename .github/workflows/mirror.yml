name: Mirror Sync

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

# GitLab is the upstream: GitLab -> GitHub is handled by .gitlab-ci.yml.
jobs:
  mirror-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to gitee
        uses: OpenSiFli/forge-mirror@v2
        with:
          src_platform: github
          src_account: ${{ github.repository_owner }}
          src_account_type: org
          dst_platform: gitee
          dst_account: SiFli
          dst_account_type: org
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          repos: |
            static:
              - SiliconSchema
          push_strategy: force

